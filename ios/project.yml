name: GBFSubtitle
options:
  bundleIdPrefix: com.granblue
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  GBFSubtitleApp:
    type: application
    platform: iOS
    sources:
      - path: GBFSubtitleApp/Sources
      - path: GBFSubtitleApp/Resources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.granblue.zhsubtitle
        PRODUCT_NAME: GBFSubtitleApp
        DISPLAY_NAME: 碧藍幻想繁中字幕
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GBFSubtitleApp/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        OTHER_LDFLAGS: "$(inherited) -lc++"
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
    info:
      path: GBFSubtitleApp/Info.plist
schemes:
  GBFSubtitleApp:
    build:
      targets:
        GBFSubtitleApp: all
    run:
      config: Debug
    archive:
      config: Release
